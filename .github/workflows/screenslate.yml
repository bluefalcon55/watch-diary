# Fetches the next two weeks of NYC repertory screenings from Screen Slate
# into data/screenslate.json, which the Theaters tab reads. Runs twice a day.
name: Update NYC screenings

on:
  schedule:
    - cron: "13 10 * * *"     # ~5-6am New York time
    - cron: "43 21 * * *"     # ~4-5pm New York time
  workflow_dispatch: {}        # lets it be run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: screenslate
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch listings
        run: python scripts/screenslate.py data/screenslate.json 14
      - name: Save if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/screenslate.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update NYC screenings"
          git pull --rebase origin main
          git push
